<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointage Chantier - SP2E</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f5f2;color:#222}
.container{max-width:1100px;margin:0 auto;padding:16px}
.header{background:linear-gradient(135deg,#669900,#7aa817);color:#fff;padding:18px 16px}
.header-in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:22px}
.header .sub{font-size:12px;opacity:.9}
.header-admin{background:linear-gradient(135deg,#9966CC,#a366dd)}
.btn{padding:10px 16px;border:0;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
.btn:disabled{opacity:.5;cursor:wait}
.btn-primary{background:#669900;color:#fff}
.btn-primary:hover:enabled{background:#5a8700}
.btn-admin{background:#9966CC;color:#fff}
.btn-admin:hover:enabled{background:#8855bb}
.btn-secondary{background:#e6e6e6;color:#333}
.btn-secondary:hover:enabled{background:#d6d6d6}
.btn-light{background:rgba(255,255,255,.2);color:#fff}
.btn-danger{background:#fff;color:#c62828;border:1px solid #f0bcbc;padding:6px 10px;font-size:12px}
.btn-danger:hover:enabled{background:#ffecec}
.login{max-width:420px;margin:40px auto;background:#fff;padding:32px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.logo{text-align:center;margin-bottom:24px}
.logo-text{font-size:34px;font-weight:800;letter-spacing:-1px}
.logo-a{color:#669900}.logo-b{color:#9966CC}
.logo .sub{color:#666;font-size:13px;margin-top:6px}
.login h2{font-size:15px;margin-bottom:14px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;color:#555;margin-bottom:5px;font-weight:500}
input,select{width:100%;padding:11px;border:2px solid #ddd;border-radius:6px;font-size:15px;font-family:inherit;background:#fff}
input:focus,select:focus{outline:0;border-color:#669900}
.hint{font-size:12px;color:#999;text-align:center;margin-top:10px}
.divider{height:1px;background:#e5e5e5;margin:26px 0}
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card h2{font-size:17px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #669900}
.weeknav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.weeknav .title{font-weight:700;text-align:center;flex:1;min-width:200px}
.day{background:#f2f6ea;border-left:4px solid #669900;border-radius:6px;padding:16px;margin-bottom:14px}
.day-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.day-name{font-size:17px;font-weight:700}
.day-date{font-size:12px;color:#666}
.day-tot{font-size:26px;font-weight:800;color:#669900;text-align:right;line-height:1}
.day-tot small{display:block;font-size:11px;color:#666;font-weight:500}
.line{background:#fff;border-left:4px solid #669900;border-radius:4px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.line .info{flex:1;min-width:0}
.line .code{font-size:12px;font-weight:700;color:#669900}
.line .nom{font-size:14px;font-weight:600}
.line .h{font-weight:700;font-size:17px;white-space:nowrap}
.line .notes{font-size:12px;color:#666;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.empty{color:#999;font-size:13px;padding:4px 0 10px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow select{flex:2;min-width:150px}
.addrow input{flex:1;min-width:90px}
.notes-input{width:100%;margin-top:8px;padding:10px;border:2px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical}
.notes-input:focus{outline:0;border-color:#669900}
.noterow{width:100%;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.btn-note{font-size:13px;padding:8px 14px}
.wtot{background:#e9f0da;border:2px solid #669900;border-radius:6px;padding:16px;text-align:center;margin-top:6px}
.wtot .n{font-size:30px;font-weight:800;color:#669900}
.wtot .l{font-size:13px;color:#555}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.plan{background:#f2f6ea;border:2px solid #cfe0ae;border-radius:6px;padding:14px}
.plan .code{font-weight:700;color:#669900;font-size:13px}
.plan .nom{font-weight:600;margin-bottom:8px}
.plan .l{font-size:12px;color:#4c7300;line-height:1.7}
.plan .l a{color:#4c7300;text-decoration:underline}
.plan .l a:hover{color:#2e6a12}
.plan .l .aucun{color:#999;font-style:italic}
.sum{background:#f6f2fb;border:2px solid #d9c7ee;border-radius:6px;padding:14px}
.sum .n{font-weight:700;margin-bottom:8px}
.sum .s{font-size:13px;color:#555}
.sum .s b{color:#9966CC}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#f5f5f5;padding:10px;text-align:left;font-size:13px;border-bottom:2px solid #ddd;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #eee;font-size:13px}
tr:hover td{background:#fafafa}
.msg{padding:11px 14px;border-radius:6px;font-size:13px;margin-bottom:14px}
.msg-err{background:#fdecec;border:1px solid #f0bcbc;color:#a32020}
.msg-ok{background:#eaf7e0;border:1px solid #b9dfa0;color:#2e6a12;font-weight:600}
.msg-info{background:#eef4fb;border:1px solid #bcd4f0;color:#20558a}
.msg-warn{background:#fff6e0;border:1px solid #f0d68a;color:#7a5b00}
.chargement{text-align:center;padding:50px 20px;color:#888;font-size:14px}
@media(max-width:640px){.header h1{font-size:19px}}
</style>
</head>
<body>
<div id="app"><div class="chargement">Chargement…</div></div>
<script>
"use strict";

/* ============================================================
   >>> COLLEZ ICI L'ADRESSE DE VOTRE APPLICATION GOOGLE APPS SCRIPT
   Elle ressemble à : https://script.google.com/macros/s/AKfy..../exec
   ============================================================ */
var API_URL = "https://script.google.com/macros/s/AKfycbwTA4ndRHBniI7kkQtYzfYbIb03ipaBEyh-qlzORKdtV7l8Gjo4u429rcf8lPKZI6ES/exec";
/* ============================================================ */

/* Les PDF des plans sont hébergés dans le même dépôt GitHub (dossier /plans/<code>/),
   servis par GitHub Pages comme cette page elle-même. */
var PLANS_BASE = "https://imad-archbtp.github.io/POINTAGE/plans/";
function lienPlan(code, nomFichier){
  return PLANS_BASE + encodeURIComponent(String(code).trim()) + "/" + encodeURIComponent(String(nomFichier).trim());
}
/* Ouvre le PDF dans un nouvel onglet quand c'est possible (Safari, Chrome...).
   Si le navigateur bloque l'ouverture d'un nouvel onglet (cas des navigateurs
   intégrés WhatsApp/SMS), on retombe sur une ouverture dans le même onglet. */
function ouvrirPlan(url){
  try{
    var f = window.open(url, "_blank");
    if(f){ try{ f.opener = null; }catch(e){} return false; }
  }catch(e){}
  window.location.href = url;
  return false;
}

var state = {
  nom: null, mdp: null, admin: false,
  chantiers: [], pointages: [], ouvriers: [],
  listeNoms: [], nomsCharges: false,
  lundi: lundiDe(new Date()),
  occupe: false, message: null, typeMessage: "err"
};
var JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];

/* ---------- Dates ---------- */
function lundiDe(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var j = x.getDay();
  x.setDate(x.getDate() - (j === 0 ? 6 : j - 1));
  return x;
}
function cle(d){
  var m = d.getMonth()+1, j = d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(j<10?"0":"")+j;
}
function affiche(k){ var p = String(k).split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function jourPlus(d,n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
function semaine(l){ var t=[]; for(var i=0;i<6;i++) t.push(jourPlus(l,i)); return t; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* Pour injecter un texte dans un onclick="fn('...')" : on echappe d'abord pour JavaScript
   (apostrophes des noms type N'Diaye), puis pour le HTML. */
function escJs(s){ return esc(String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")); }
function arrondi(n){ return Math.round(n*100)/100; }

/* ---------- Session (survit au rafraîchissement) ---------- */
function memoriser(){
  try{
    if(state.nom) sessionStorage.setItem("sp2e_session", JSON.stringify({nom:state.nom, mdp:state.mdp}));
    else if(state.admin) sessionStorage.setItem("sp2e_session", JSON.stringify({admin:true, mdp:state.mdp}));
    else sessionStorage.removeItem("sp2e_session");
  }catch(e){}
}
function reprendre(){
  try{
    var s = sessionStorage.getItem("sp2e_session");
    return s ? JSON.parse(s) : null;
  }catch(e){ return null; }
}

/* ---------- Appel serveur ---------- */
function appeler(donnees){
  if(API_URL.indexOf("script.google.com") === -1){
    return Promise.reject(new Error("L'adresse du serveur n'est pas encore renseignée dans le fichier (variable API_URL)."));
  }
  var controle = ("AbortController" in window) ? new AbortController() : null;
  var expire = setTimeout(function(){ if(controle) controle.abort(); }, 30000);
  var options = { method:"POST", body: JSON.stringify(donnees) };
  if(controle) options.signal = controle.signal;
  return fetch(API_URL, options)
    .then(function(r){ clearTimeout(expire); return r.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.erreur || "Erreur du serveur.");
      return j;
    })
    .catch(function(e){
      clearTimeout(expire);
      if(e && e.name === "AbortError"){
        throw new Error("Le serveur met vraiment trop de temps à répondre (plus de 30 secondes). Vérifiez votre Google Sheet : la ligne a peut-être quand même été enregistrée avant de réessayer.");
      }
      throw e;
    });
}
function erreur(e){
  var m = e && e.message ? e.message : String(e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)){
    m = "Connexion impossible. Vérifiez votre réseau, puis réessayez.";
  }
  state.message = m; state.typeMessage = "err";
  state.occupe = false; dessiner();
  scrollHaut();
}
function scrollHaut(){
  try{ window.scrollTo({top:0, behavior:"smooth"}); }catch(e){ window.scrollTo(0,0); }
}

/* ---------- Actions ---------- */
/* Recupere la liste des prenoms pour alimenter le menu deroulant de connexion.
   Objectif : plus personne ne tape son nom a la main, donc plus d'echec de
   connexion sur une orthographe approchante (Yaacoub / Yaakoub / Yacoub...).
   Si l'appel echoue, on retombe sur l'ancien champ libre plutot que de bloquer. */
function chargerNoms(){
  if(state.nomsCharges) return;
  state.nomsCharges = true;
  /* La liste est d'abord relue du cache local : l'ouvrier voit son nom
     immediatement, sans attendre le serveur. Le rafraichissement se fait
     ensuite en arriere-plan. En cas d'echec reseau on garde le cache plutot
     que de retomber sur la saisie libre. */
  try{
    var cache = localStorage.getItem("sp2e_ouvriers");
    if(cache) state.listeNoms = JSON.parse(cache) || [];
  }catch(e){}
  appeler({action:"ouvriers"}).then(function(j){
    state.listeNoms = j.ouvriers || [];
    try{ localStorage.setItem("sp2e_ouvriers", JSON.stringify(state.listeNoms)); }catch(e2){}
    if(!state.nom && !state.admin) dessiner();
  }).catch(function(){
    if(!state.nom && !state.admin) dessiner();
  });
}
function connexion(){
  var nom = (document.getElementById("f-nom").value||"").trim();
  var mdp = (document.getElementById("f-mdp").value||"").trim();
  if(!nom || !mdp){ state.message="Choisissez votre nom et saisissez votre code d'accès."; state.typeMessage="err"; dessiner(); return; }
  state.occupe = true; state.message = null; dessiner();
  appeler({action:"login", nom:nom, mdp:mdp}).then(function(j){
    state.nom = j.nom; state.mdp = mdp; state.admin = false;
    state.chantiers = j.chantiers; state.lundi = lundiDe(new Date());
    memoriser();
    /* Le serveur renvoie desormais les pointages avec la connexion : un
       aller-retour de moins avant de voir sa semaine. */
    if(j.pointages){ state.pointages = j.pointages; state.occupe = false; dessiner(); return; }
    return chargerMes();
  }).catch(erreur);
}
function connexionAdmin(){
  var mdp = (document.getElementById("f-admin").value||"").trim();
  if(!mdp){ state.message="Saisissez le mot de passe."; state.typeMessage="err"; dessiner(); return; }
  state.occupe = true; state.message = null; dessiner();
  appeler({action:"loginAdmin", mdp:mdp}).then(function(j){
    state.admin = true; state.nom = null; state.mdp = mdp;
    state.chantiers = j.chantiers;
    memoriser();
    return chargerTous();
  }).catch(erreur);
}
function chargerMes(){
  state.occupe = true; dessiner();
  return appeler({action:"mes", nom:state.nom, mdp:state.mdp}).then(function(j){
    state.pointages = j.pointages; state.occupe = false; dessiner();
  }).catch(erreur);
}
function chargerTous(){
  state.occupe = true; dessiner();
  return appeler({action:"tous", mdpAdmin:state.mdp}).then(function(j){
    state.pointages = j.pointages; state.ouvriers = j.ouvriers;
    state.occupe = false; dessiner();
  }).catch(erreur);
}
function deconnexion(){
  state.nom=null; state.mdp=null; state.admin=false;
  state.pointages=[]; state.message=null;
  // On force le rechargement de la liste : un ouvrier ajoute pendant la session
  // admin doit apparaitre tout de suite dans le menu de connexion.
  state.listeNoms=[]; state.nomsCharges=false;
  memoriser(); dessiner();
}
function semPrec(){ state.lundi = jourPlus(state.lundi,-7); dessiner(); }
function semSuiv(){ state.lundi = jourPlus(state.lundi,7); dessiner(); }
function semAuj(){ state.lundi = lundiDe(new Date()); dessiner(); }

function ajouter(k){
  var sel = document.getElementById("ch-"+k), inp = document.getElementById("hr-"+k), ntEl = document.getElementById("nt-"+k);
  var code = sel.value;
  var h = parseFloat(String(inp.value).replace(",","."));
  var notes = ntEl ? (ntEl.value||"").trim().substring(0,200) : "";
  if(!code){ state.message="Choisissez un chantier."; state.typeMessage="err"; dessiner(); return; }
  if(!(h>0) || h>24){ state.message="Saisissez un nombre d'heures valide (ex : 8 ou 7.5)."; state.typeMessage="err"; dessiner(); return; }

  var nomCh = "";
  for(var n=0;n<state.chantiers.length;n++) if(state.chantiers[n].code===code) nomCh = state.chantiers[n].nom;

  var dejaPointe = 0;
  for(var i=0;i<state.pointages.length;i++){
    if(state.pointages[i].date===k && state.pointages[i].code===code) dejaPointe += state.pointages[i].heures;
  }
  if(dejaPointe > 0){
    var poursuivre = confirm("Vous avez déjà "+arrondi(dejaPointe)+" h enregistrées sur "+code+" - "+nomCh+" ce jour-là.\nAjouter "+h+" h de plus ?");
    if(!poursuivre) return;
  }

  state.occupe = true; state.message = null; dessiner();
  appeler({action:"ajouter", nom:state.nom, mdp:state.mdp, date:k, code:code, heures:h, notes:notes}).then(function(){
    state.message = "Enregistré : "+h+" h sur "+code+" - "+nomCh+" ("+affiche(k)+").";
    state.typeMessage = "ok";
    return chargerMes();
  }).then(function(){
    scrollHaut();
  }).catch(erreur);
}
function supprimer(id){
  if(!confirm("Supprimer cette ligne ?")) return;
  state.occupe = true; state.message = null; dessiner();
  var d = state.admin
    ? {action:"supprimer", id:id, mdpAdmin:state.mdp}
    : {action:"supprimer", id:id, nom:state.nom, mdp:state.mdp};
  appeler(d).then(state.admin ? chargerTous : chargerMes).catch(erreur);
}

/* La note du jour n'est pas une ligne de pointage : elle se pose sur les heures deja
   saisies ce jour-la. Ce bouton appelait "ajouter", qui exigeait un chantier et des
   heures, et repondait donc invariablement "Choisissez un chantier". */
function validerNote(k){
  var el = document.getElementById("nt-"+k);
  var notes = el ? (el.value||"").trim().substring(0,200) : "";
  state.occupe = true; state.message = null; dessiner();
  appeler({action:"noterJour", nom:state.nom, mdp:state.mdp, date:k, notes:notes}).then(function(){
    state.message = notes
      ? "Note du "+affiche(k)+" enregistrée."
      : "Note du "+affiche(k)+" effacée.";
    state.typeMessage = "ok";
    return chargerMes();
  }).then(function(){
    scrollHaut();
  }).catch(erreur);
}

/* ---------- Gestion des ouvriers (admin) ---------- */
function ajouterOuvrier(){
  var nom = (document.getElementById("o-nom").value||"").trim();
  var mdp = (document.getElementById("o-mdp").value||"").trim();
  if(!nom){ state.message="Saisissez le nom de l'ouvrier."; state.typeMessage="err"; dessiner(); return; }
  if(mdp.length < 4){ state.message="Le code d'accès doit faire au moins 4 caractères."; state.typeMessage="err"; dessiner(); return; }
  state.occupe = true; state.message = null; dessiner();
  appeler({action:"ajouterOuvrier", mdpAdmin:state.mdp, nouveauNom:nom, nouveauMdp:mdp}).then(function(j){
    state.ouvriers = j.ouvriers;
    state.message = "Ouvrier ajouté : "+nom+". Transmettez-lui son code d'accès.";
    state.typeMessage = "ok"; state.occupe = false;
    dessiner(); scrollHaut();
  }).catch(erreur);
}
function changerCodeOuvrier(nom){
  var c = prompt("Nouveau code d'accès pour "+nom+" (4 caractères minimum) :");
  if(c === null) return;
  c = String(c).trim();
  if(c.length < 4){ state.message="Le code d'accès doit faire au moins 4 caractères."; state.typeMessage="err"; dessiner(); return; }
  state.occupe = true; state.message = null; dessiner();
  appeler({action:"changerMdpOuvrier", mdpAdmin:state.mdp, nouveauNom:nom, nouveauMdp:c}).then(function(j){
    state.ouvriers = j.ouvriers;
    state.message = "Code d'accès modifié pour "+nom+".";
    state.typeMessage = "ok"; state.occupe = false;
    dessiner(); scrollHaut();
  }).catch(erreur);
}
function retirerOuvrier(nom){
  if(!confirm("Retirer "+nom+" de la liste ?\n\nSes pointages déjà enregistrés sont conservés : seul son accès à l'application est supprimé.")) return;
  state.occupe = true; state.message = null; dessiner();
  appeler({action:"supprimerOuvrier", mdpAdmin:state.mdp, nouveauNom:nom}).then(function(j){
    state.ouvriers = j.ouvriers;
    state.message = nom+" n'a plus accès à l'application.";
    state.typeMessage = "ok"; state.occupe = false;
    dessiner(); scrollHaut();
  }).catch(erreur);
}

/* ---------- Export Excel (aucune librairie externe) ---------- */
var MOIS_FR = ["janvier","février","mars","avril","mai","juin",
               "juillet","août","septembre","octobre","novembre","décembre"];
function moisDe(dateISO){ return String(dateISO).substring(0,7); }   /* "2026-09-14" -> "2026-09" */
function libelleMois(ym){
  var p = String(ym).split("-");
  var n = parseInt(p[1],10);
  return (MOIS_FR[n-1] || p[1]) + " " + p[0];
}
/* Mois effectivement presents dans les pointages, du plus recent au plus ancien. */
function moisDisponibles(){
  var vus = {}, t = [];
  for(var i=0;i<state.pointages.length;i++){
    var m = moisDe(state.pointages[i].date);
    if(m && !vus[m]){ vus[m] = 1; t.push(m); }
  }
  t.sort();
  t.reverse();
  return t;
}

/* Meme normalisation que le serveur : "Nadeem", "nadeem" et "NADEEM" doivent compter
   pour une seule personne. Sans cela, un nom reecrit dans la feuille scinderait le
   total d'un ouvrier en deux lignes, et la paie ne verrait rien. */
var RE_ACCENTS = new RegExp('[' + String.fromCharCode(768) + '-' + String.fromCharCode(879) + ']', 'g');
function clefOuvrier(nom){
  var s = String(nom == null ? "" : nom);
  if(s.normalize) s = s.normalize("NFD").replace(RE_ACCENTS, "");
  return s.toLowerCase().replace(/[^a-z0-9]/g, "");
}
/* Orthographe de reference : celle de la fiche ouvrier, sinon celle rencontree. */
function nomCanonique(nom){
  var c = clefOuvrier(nom);
  for(var i=0;i<state.ouvriers.length;i++){
    if(clefOuvrier(state.ouvriers[i]) === c) return state.ouvriers[i];
  }
  return nom;
}

/* Tri par ouvrier puis par date : c'est l'ordre dans lequel la paie additionne. */
function triPaie(a,b){
  var x = clefOuvrier(a.ouvrier), y = clefOuvrier(b.ouvrier);
  if(x !== y) return x < y ? -1 : 1;
  return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
}

/* Mise en forme reconnue par Excel a l'ouverture d'un classeur HTML.
   mso-number-format:"\@" force le format Texte : sans lui Excel transforme
   le code affaire 016 en nombre 16. */
var STYLE_XLS = '<style>'
  + 'table{border-collapse:collapse}'
  + 'td,th{font-family:Calibri,Arial,sans-serif;font-size:11.0pt;'
  +       'border:0.5pt solid #c8d9ae;padding:3px 7px;vertical-align:middle}'
  + 'th{background:#669900;color:#ffffff;font-weight:bold;text-align:left}'
  + '.titre{font-size:16.0pt;font-weight:bold;color:#4c7300;border:none}'
  + '.sstitre{font-size:9.0pt;color:#808080;border:none}'

/* Excel ignore le BOM et la declaration d'encodage a l'ouverture d'un classeur
   HTML : "août" arrive en "aoÃ»t". En revanche il decode toujours les entites
   HTML. On convertit donc tout caractere non-ASCII en entite numerique, ce qui
   rend le fichier insensible a l'encodage suppose par Excel. */
function versEntites(s){
  var t = String(s), out = "";
  for(var i=0;i<t.length;i++){
    var c = t.charCodeAt(i);
    out += (c > 126) ? ("&#" + c + ";") : t.charAt(i);
  }
  return out;
}

function telechargerClasseur(corps, nomFichier){
  /* Excel n'interprete pas la forme courte <meta charset>. Sans l'en-tete
     http-equiv ci-dessous, "août" arrive dans la feuille en "aoÃ»t". */
  var doc = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head>'
    + '<meta http-equiv="Content-Type" content="text/html; charset=utf-8">'
    + '<meta charset="UTF-8">'
    + '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
    + '<x:Name>Pointages</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>'
    + '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->'
    + STYLE_XLS + '</head><body>' + versEntites(corps) + '</body></html>';
  /* BOM en tete, sinon Excel affiche les accents en mojibake */
  var bom = String.fromCharCode(65279);
  var url = URL.createObjectURL(new Blob([bom+doc],{type:"application/vnd.ms-excel;charset=utf-8"}));
  var a = document.createElement("a");
  a.href = url; a.download = nomFichier;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}

function enTeteClasseur(titre, nbColonnes){
  return '<table><tr><td class="titre" colspan="'+nbColonnes+'">'+esc(titre)+'</td></tr>'
       + '<tr><td class="sstitre" colspan="'+nbColonnes+'">SP2E &ndash; édité le '+affiche(cle(new Date()))+'</td></tr>'
       + '</table><br>';
}

/* Regroupe les lignes par ouvrier : heures, nombre de jours distincts, et
   repartition par mois. Sert aussi bien au recapitulatif mensuel qu'au
   tableau croise de l'export global. */
function regrouperParOuvrier(lignes){
  var clefs = [], parClef = {};
  for(var i=0;i<lignes.length;i++){
    var c = clefOuvrier(lignes[i].ouvrier);
    if(!Object.prototype.hasOwnProperty.call(parClef,c)){
      parClef[c] = { nom: nomCanonique(lignes[i].ouvrier), heures:0, jours:{}, parMois:{} };
      clefs.push(c);
    }
    var e = parClef[c];
    e.heures += lignes[i].heures;
    e.jours[lignes[i].date] = 1;
    var m = moisDe(lignes[i].date);
    e.parMois[m] = (e.parMois[m] || 0) + lignes[i].heures;
  }
  clefs.sort();
  var t = [];
  for(var k=0;k<clefs.length;k++){
    var x = parClef[clefs[k]], nb = 0;
    for(var d in x.jours){ if(Object.prototype.hasOwnProperty.call(x.jours,d)) nb++; }
    x.nbJours = nb;
    t.push(x);
  }
  return t;
}

/* Recapitulatif d'un mois : une ligne par ouvrier. C'est ce que la paie lit,
   le detail qui suit ne sert qu'a justifier les totaux. */
function tableauRecapMois(groupes){
  var t = '<table><tr><th>Ouvrier</th><th>Jours travaillés</th><th>Total heures</th></tr>';
  var tot = 0, totJours = 0;
  for(var i=0;i<groupes.length;i++){
    tot += groupes[i].heures;
    totJours += groupes[i].nbJours;
    t += '<tr><td>'+esc(groupes[i].nom)+'</td><td class="h">'+groupes[i].nbJours+'</td>'
      +  '<td class="h">'+arrondi(groupes[i].heures)+'</td></tr>';
  }
  t += '<tr class="tot"><td>TOTAL</td><td class="h">'+totJours+'</td>'
    +  '<td class="h">'+arrondi(tot)+'</td></tr></table>';
  return t;
}

/* Tableau croise ouvriers x mois : le total de chaque ouvrier, mois par mois. */
function tableauCroise(groupes, mois){
  /* class="txt" sur les mois : sinon Excel lit "juillet 2026" comme une date
     et l'affiche "juil-26" dans l'en-tete du tableau. */
  var t = '<table><tr><th>Ouvrier</th>';
  for(var m=0;m<mois.length;m++) t += '<th class="txt">'+esc(libelleMois(mois[m]))+'</th>';
  t += '<th>Total</th></tr>';
  var totCol = [], totGen = 0;
  for(var z=0;z<mois.length;z++) totCol[z] = 0;
  for(var i=0;i<groupes.length;i++){
    t += '<tr><td>'+esc(groupes[i].nom)+'</td>';
    for(var j=0;j<mois.length;j++){
      var v = groupes[i].parMois[mois[j]] || 0;
      totCol[j] += v;
      t += '<td class="h">'+(v ? arrondi(v) : '')+'</td>';
    }
    totGen += groupes[i].heures;
    t += '<td class="sous h">'+arrondi(groupes[i].heures)+'</td></tr>';
  }
  t += '<tr class="tot"><td>TOTAL</td>';
  for(var k=0;k<mois.length;k++) t += '<td class="h">'+arrondi(totCol[k])+'</td>';
  t += '<td class="h">'+arrondi(totGen)+'</td></tr></table>';
  return t;
}

function ligneDetail(p, avecMois){
  return '<tr><td>'+esc(p.ouvrier)+'</td>'
       + (avecMois ? '<td class="txt">'+esc(libelleMois(moisDe(p.date)))+'</td>' : '')
       + '<td>'+affiche(p.date)+'</td>'
       + '<td class="txt">'+esc(p.code)+'</td>'
       + '<td>'+esc(p.chantier)+'</td>'
       + '<td class="h">'+p.heures+'</td>'
       + '<td>'+esc(p.notes||"")+'</td></tr>';
}

/* Detail ligne a ligne, coupe par ouvrier, avec un sous-total apres chaque
   ouvrier. Le nom reste sur chaque ligne pour rester filtrable dans Excel. */
function tableauDetail(lignes, avecMois){
  var nbCol = avecMois ? 7 : 6;
  var t = '<table><tr><th>Ouvrier</th>'
        + (avecMois ? '<th>Mois</th>' : '')
        + '<th>Date</th><th>Code affaire</th><th>Chantier</th><th>Heures</th><th>Notes</th></tr>';
  var tot = 0, sousTot = 0, sousJours = {}, clefCourante = null, nomCourant = null;

  function fermerGroupe(){
    if(clefCourante === null) return '';
    var nb = 0;
    for(var d in sousJours){ if(Object.prototype.hasOwnProperty.call(sousJours,d)) nb++; }
    return '<tr class="sous"><td colspan="'+(nbCol-2)+'">Total '+esc(nomCourant)+' &ndash; '+nb+' jour(s)</td>'
         + '<td class="h">'+arrondi(sousTot)+'</td><td></td></tr>'
         + '<tr class="vide"><td colspan="'+nbCol+'"></td></tr>';
  }

  for(var i=0;i<lignes.length;i++){
    var c = clefOuvrier(lignes[i].ouvrier);
    if(c !== clefCourante){
      t += fermerGroupe();
      clefCourante = c; nomCourant = nomCanonique(lignes[i].ouvrier);
      sousTot = 0; sousJours = {};
    }
    sousTot += lignes[i].heures;
    sousJours[lignes[i].date] = 1;
    tot += lignes[i].heures;
    t += ligneDetail(lignes[i], avecMois);
  }
  t += fermerGroupe();
  t += '<tr class="tot"><td colspan="'+(nbCol-2)+'">TOTAL GÉNÉRAL</td>'
    +  '<td class="h">'+arrondi(tot)+'</td><td></td></tr></table>';
  return t;
}

function titreSection(texte, nbColonnes){
  return '<table><tr><td class="grp" colspan="'+nbColonnes+'">'+esc(texte)+'</td></tr></table>';
}

function exportExcelMois(){
  var sel = document.getElementById("mois-export");
  var ym = sel ? sel.value : "";
  if(!ym){ state.message="Choisissez le mois à exporter."; state.typeMessage="err"; dessiner(); return; }
  var l = [];
  for(var i=0;i<state.pointages.length;i++){
    if(moisDe(state.pointages[i].date) === ym) l.push(state.pointages[i]);
  }
  if(l.length === 0){
    state.message="Aucun pointage en "+libelleMois(ym)+"."; state.typeMessage="err"; dessiner(); return;
  }
  l.sort(triPaie);
  var groupes = regrouperParOuvrier(l);
  var tot = 0;
  for(var g=0;g<groupes.length;g++) tot += groupes[g].heures;

  var corps = enTeteClasseur("Pointages " + libelleMois(ym), 3)
            + titreSection("Total par ouvrier", 3)
            + tableauRecapMois(groupes) + '<br><br>'
            + titreSection("Détail des pointages", 6)
            + tableauDetail(l, false);

  telechargerClasseur(corps, "Pointages_"+ym+".xls");
  state.message = "Export de "+libelleMois(ym)+" : "+groupes.length+" ouvrier(s), "
                + l.length+" ligne(s), "+arrondi(tot)+" h au total.";
  state.typeMessage = "ok"; dessiner();
}

/* Export global : le total de chaque ouvrier mois par mois, en tableau croise,
   puis le detail complet. Utile pour les reprises de fin d'annee. */
function exportExcelTout(){
  if(state.pointages.length === 0){ state.message="Aucun pointage à exporter."; state.typeMessage="err"; dessiner(); return; }
  var l = state.pointages.slice().sort(triPaie);
  var groupes = regrouperParOuvrier(l);
  var mois = moisDisponibles().slice().sort();   /* du plus ancien au plus recent */

  var corps = enTeteClasseur("Pointages SP2E – toutes périodes", mois.length + 2)
            + titreSection("Total par ouvrier et par mois", mois.length + 2)
            + tableauCroise(groupes, mois) + '<br><br>'
            + titreSection("Détail des pointages", 7)
            + tableauDetail(l, true);

  telechargerClasseur(corps, "Pointages_toutes-periodes_"+cle(new Date())+".xls");
  state.message = "Export global : "+groupes.length+" ouvrier(s), "+mois.length+" mois, "
                + l.length+" ligne(s).";
  state.typeMessage = "ok"; dessiner();
}
/* ---------- Rendu ---------- */
function bandeau(){
  if(!state.message) return "";
  return '<div class="msg msg-'+state.typeMessage+'">'+esc(state.message)+'</div>';
}
function dessiner(){
  var app = document.getElementById("app");
  if(state.admin) app.innerHTML = vueAdmin();
  else if(state.nom) app.innerHTML = vueOuvrier();
  else { app.innerHTML = vueLogin(); var n=document.getElementById("f-nom"); if(n && !state.occupe) n.focus(); }
}

function vueOuvrier(){
  var jours = semaine(state.lundi);

  + '<div class="header"><div class="header-in">'
  +   '<div><h1>Pointage chantier</h1><div class="sub">SP2E &middot; '+esc(state.nom)+'</div></div>'
  +   '<button type="button" class="btn btn-light" onclick="deconnexion()">Déconnexion</button>'
  + '</div></div><div class="container">'
  + bandeau()
  + (state.occupe ? '<div class="msg msg-info">Synchronisation en cours…</div>' : '')

  +   '<div class="weeknav">'
  +     '<button type="button" class="btn btn-secondary" onclick="semPrec()">&larr; Semaine précédente</button>'
  +     '<div class="title">Semaine du '+affiche(cle(jours[0]))+' au '+affiche(cle(jours[5]))+'</div>'
  +     '<button type="button" class="btn btn-secondary" onclick="semSuiv()">Semaine suivante &rarr;</button>'
  +   '</div>'
  +   '<div style="text-align:center;margin-bottom:16px"><button type="button" class="btn btn-secondary" onclick="semAuj()">Revenir à cette semaine</button></div>';

  var totSem = 0;
  for(var i=0;i<jours.length;i++){
    var k = cle(jours[i]), duJour = [], totJour = 0;
    for(var j=0;j<state.pointages.length;j++){
      if(state.pointages[j].date === k){ duJour.push(state.pointages[j]); totJour += state.pointages[j].heures; }
    }
    totSem += totJour;
    // La note est portee par les lignes du jour : on reaffiche celle deja enregistree
    // pour qu'elle soit modifiable plutot que d'avoir a la retaper.
    var noteJour = "";
    for(var nj=0;nj<duJour.length;nj++){ if(duJour[nj].notes){ noteJour = duJour[nj].notes; break; } }
    h += '<div class="day"><div class="day-h">'
      +  '<div><div class="day-name">'+JOURS[i]+'</div><div class="day-date">'+affiche(k)+'</div></div>'
      +  '<div class="day-tot"><small>Total du jour</small>'+arrondi(totJour)+' h</div></div>';
    if(duJour.length === 0) h += '<div class="empty">Aucune heure saisie.</div>';
    for(var m=0;m<duJour.length;m++){
      h += '<div class="line"><div class="info"><div class="code">'+esc(duJour[m].code)+'</div>'
        +  '<div class="nom">'+esc(duJour[m].chantier)+'</div>'
        +  (duJour[m].notes ? '<div class="notes">'+esc(duJour[m].notes)+'</div>' : '')
        +  '</div>'
        +  '<div class="h">'+duJour[m].heures+' h</div>'
        +  '<button type="button" class="btn btn-danger" onclick="supprimer(\''+esc(duJour[m].id)+'\')"'+dis+'>Supprimer</button></div>';
    }
    h += '<div class="addrow"><select id="ch-'+k+'"'+dis+'><option value="">Choisir un chantier</option>';
    for(var n=0;n<state.chantiers.length;n++){
      h += '<option value="'+esc(state.chantiers[n].code)+'">'+esc(state.chantiers[n].code+" - "+state.chantiers[n].nom)+'</option>';
    }
    h += '</select><input type="number" id="hr-'+k+'" step="0.5" min="0" max="24" inputmode="decimal" placeholder="Heures"'+dis+'>'
      +  '<button type="button" class="btn btn-primary" onclick="ajouter(\''+k+'\')"'+dis+'>Ajouter</button></div>'
      +  '<div class="noterow">'
      +    '<textarea id="nt-'+k+'" class="notes-input" maxlength="200" rows="2" placeholder="Notes du jour (optionnel, 200 caractères max) : ce qui a été fait, matériel utilisé, remarques…"'+dis+'>'+esc(noteJour)+'</textarea>'
      +    '<button type="button" class="btn btn-secondary btn-note" onclick="validerNote(\''+k+'\')"'+dis+'>Valider la note</button>'
      +  '</div>'
      +  '</div>';
  }

  h += '<div class="wtot"><div class="l">Total de la semaine</div><div class="n">'+arrondi(totSem)+' h</div></div></div>';

  h += '<div class="card"><h2>Plans des chantiers</h2><div class="grid">';

      }
    }
    h += '</div></div>';
  }
  h += '</div></div></div>';
  return h;
}

/* Un fichier par mois : l'export unique devenait illisible et obligeait la paie a
   additionner les heures a la main. Le mois le plus recent est propose par defaut. */

    +    '<select id="mois-export"'+dis+'>';

  h += '</div><div class="card"><h2>Récapitulatif par ouvrier</h2><div class="grid">';
  for(var k=0;k<state.ouvriers.length;k++){
    var tot=0, nb=0, ck=clefOuvrier(state.ouvriers[k]);
    for(var j=0;j<state.pointages.length;j++){
      if(clefOuvrier(state.pointages[j].ouvrier) === ck){ tot += state.pointages[j].heures; nb++; }
    }
    h += '<div class="sum"><div class="n">'+esc(state.ouvriers[k])+'</div>'
      +  '<div class="s">Lignes saisies : <b>'+nb+'</b></div>'
      +  '<div class="s">Total : <b>'+arrondi(tot)+' h</b></div></div>';
  }
  h += '</div></div></div>';
  return h;
}

/* ---------- Démarrage ---------- */
document.addEventListener("keydown", function(e){
  if(e.key !== "Enter" || state.occupe) return;
  var id = e.target && e.target.id;
  if(id === "f-admin") connexionAdmin();
  else if(id === "f-nom" || id === "f-mdp") connexion();
  else if(id === "o-nom" || id === "o-mdp") ajouterOuvrier();
  else if(id && id.indexOf("hr-") === 0) ajouter(id.substring(3));
});

(function(){
  var s = reprendre();
  if(s && s.admin){
    state.admin = true; state.mdp = s.mdp;
    appeler({action:"loginAdmin", mdp:s.mdp}).then(function(j){
      state.chantiers = j.chantiers; return chargerTous();
    }).catch(function(){ deconnexion(); });
  } else if(s && s.nom){
    state.nom = s.nom; state.mdp = s.mdp;
    appeler({action:"login", nom:s.nom, mdp:s.mdp}).then(function(j){
      state.chantiers = j.chantiers;
      if(j.pointages){ state.pointages = j.pointages; state.occupe = false; dessiner(); return; }
      return chargerMes();
    }).catch(function(){ deconnexion(); });
  } else {
    dessiner();
  }
})();
</script>
