<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pointage Chantier - SP2E</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f4f5f2;color:#222}
.container{max-width:1100px;margin:0 auto;padding:16px}
.header{background:linear-gradient(135deg,#669900,#7aa817);color:#fff;padding:18px 16px}
.header-in{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.header h1{font-size:22px}
.header .sub{font-size:12px;opacity:.9}
.header-admin{background:linear-gradient(135deg,#9966CC,#a366dd)}
.btn{padding:10px 16px;border:0;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
.btn:disabled{opacity:.5;cursor:wait}
.btn-primary{background:#669900;color:#fff}
.btn-primary:hover:enabled{background:#5a8700}
.btn-admin{background:#9966CC;color:#fff}
.btn-admin:hover:enabled{background:#8855bb}
.btn-secondary{background:#e6e6e6;color:#333}
.btn-secondary:hover:enabled{background:#d6d6d6}
.btn-light{background:rgba(255,255,255,.2);color:#fff}
.btn-danger{background:#fff;color:#c62828;border:1px solid #f0bcbc;padding:6px 10px;font-size:12px}
.btn-danger:hover:enabled{background:#ffecec}
.login{max-width:420px;margin:40px auto;background:#fff;padding:32px;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.logo{text-align:center;margin-bottom:24px}
.logo-text{font-size:34px;font-weight:800;letter-spacing:-1px}
.logo-a{color:#669900}.logo-b{color:#9966CC}
.logo .sub{color:#666;font-size:13px;margin-top:6px}
.login h2{font-size:15px;margin-bottom:14px}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;color:#555;margin-bottom:5px;font-weight:500}
input,select{width:100%;padding:11px;border:2px solid #ddd;border-radius:6px;font-size:15px;font-family:inherit;background:#fff}
input:focus,select:focus{outline:0;border-color:#669900}
.hint{font-size:12px;color:#999;text-align:center;margin-top:10px}
.divider{height:1px;background:#e5e5e5;margin:26px 0}
.card{background:#fff;border-radius:8px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card h2{font-size:17px;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid #669900}
.weeknav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.weeknav .title{font-weight:700;text-align:center;flex:1;min-width:200px}
.day{background:#f2f6ea;border-left:4px solid #669900;border-radius:6px;padding:16px;margin-bottom:14px}
.day-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
.day-name{font-size:17px;font-weight:700}
.day-date{font-size:12px;color:#666}
.day-tot{font-size:26px;font-weight:800;color:#669900;text-align:right;line-height:1}
.day-tot small{display:block;font-size:11px;color:#666;font-weight:500}
.line{background:#fff;border-left:4px solid #669900;border-radius:4px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.line .info{flex:1;min-width:0}
.line .code{font-size:12px;font-weight:700;color:#669900}
.line .nom{font-size:14px;font-weight:600}
.line .h{font-weight:700;font-size:17px;white-space:nowrap}
.line .notes{font-size:12px;color:#666;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.empty{color:#999;font-size:13px;padding:4px 0 10px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow select{flex:2;min-width:150px}
.addrow input{flex:1;min-width:90px}
.notes-input{width:100%;margin-top:8px;padding:10px;border:2px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit;resize:vertical}
.notes-input:focus{outline:0;border-color:#669900}
.wtot{background:#e9f0da;border:2px solid #669900;border-radius:6px;padding:16px;text-align:center;margin-top:6px}
.wtot .n{font-size:30px;font-weight:800;color:#669900}
.wtot .l{font-size:13px;color:#555}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.plan{background:#f2f6ea;border:2px solid #cfe0ae;border-radius:6px;padding:14px}
.plan .code{font-weight:700;color:#669900;font-size:13px}
.plan .nom{font-weight:600;margin-bottom:8px}
.plan .l{font-size:12px;color:#4c7300;line-height:1.7}
.sum{background:#f6f2fb;border:2px solid #d9c7ee;border-radius:6px;padding:14px}
.sum .n{font-weight:700;margin-bottom:8px}
.sum .s{font-size:13px;color:#555}
.sum .s b{color:#9966CC}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{background:#f5f5f5;padding:10px;text-align:left;font-size:13px;border-bottom:2px solid #ddd;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #eee;font-size:13px}
tr:hover td{background:#fafafa}
.msg{padding:11px 14px;border-radius:6px;font-size:13px;margin-bottom:14px}
.msg-err{background:#fdecec;border:1px solid #f0bcbc;color:#a32020}
.msg-ok{background:#eaf7e0;border:1px solid #b9dfa0;color:#2e6a12;font-weight:600}
.msg-info{background:#eef4fb;border:1px solid #bcd4f0;color:#20558a}
.msg-warn{background:#fff6e0;border:1px solid #f0d68a;color:#7a5b00}
.chargement{text-align:center;padding:50px 20px;color:#888;font-size:14px}
@media(max-width:640px){.header h1{font-size:19px}}
</style>
</head>
<body>
<div id="app"><div class="chargement">Chargement…</div></div>
<script>
"use strict";

/* ============================================================
   >>> COLLEZ ICI L'ADRESSE DE VOTRE APPLICATION GOOGLE APPS SCRIPT
   Elle ressemble à : https://script.google.com/macros/s/AKfy..../exec
   ============================================================ */
var API_URL = "https://script.google.com/macros/s/AKfycbwTA4ndRHBniI7kkQtYzfYbIb03ipaBEyh-qlzORKdtV7l8Gjo4u429rcf8lPKZI6ES/exec";
/* ============================================================ */

var state = {
  nom: null, mdp: null, admin: false,
  chantiers: [], pointages: [], ouvriers: [],
  lundi: lundiDe(new Date()),
  occupe: false, message: null, typeMessage: "err"
};
var JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];

/* ---------- Dates ---------- */
function lundiDe(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var j = x.getDay();
  x.setDate(x.getDate() - (j === 0 ? 6 : j - 1));
  return x;
}
function cle(d){
  var m = d.getMonth()+1, j = d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(j<10?"0":"")+j;
}
function affiche(k){ var p = String(k).split("-"); return p[2]+"/"+p[1]+"/"+p[0]; }
function jourPlus(d,n){ var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; }
function semaine(l){ var t=[]; for(var i=0;i<6;i++) t.push(jourPlus(l,i)); return t; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function arrondi(n){ return Math.round(n*100)/100; }

/* ---------- Session (survit au rafraîchissement) ---------- */
function memoriser(){
  try{
    if(state.nom) sessionStorage.setItem("sp2e_session", JSON.stringify({nom:state.nom, mdp:state.mdp}));
    else if(state.admin) sessionStorage.setItem("sp2e_session", JSON.stringify({admin:true, mdp:state.mdp}));
    else sessionStorage.removeItem("sp2e_session");
  }catch(e){}
}
function reprendre(){
  try{
    var s = sessionStorage.getItem("sp2e_session");
    return s ? JSON.parse(s) : null;
  }catch(e){ return null; }
}

/* ---------- Appel serveur ---------- */
function appeler(donnees){
  if(API_URL.indexOf("script.google.com") === -1){
    return Promise.reject(new Error("L'adresse du serveur n'est pas encore renseignée dans le fichier (variable API_URL)."));
  }
  var controle = ("AbortController" in window) ? new AbortController() : null;
  var expire = setTimeout(function(){ if(controle) controle.abort(); }, 30000);
  var options = { method:"POST", body: JSON.stringify(donnees) };
  if(controle) options.signal = controle.signal;
  return fetch(API_URL, options)
    .then(function(r){ clearTimeout(expire); return r.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.erreur || "Erreur du serveur.");
      return j;
    })
    .catch(function(e){
      clearTimeout(expire);
      if(e && e.name === "AbortError"){
        throw new Error("Le serveur met vraiment trop de temps à répondre (plus de 30 secondes). Vérifiez votre Google Sheet : la ligne a peut-être quand même été enregistrée avant de réessayer.");
      }
      throw e;
    });
}
function erreur(e){
  var m = e && e.message ? e.message : String(e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)){
    m = "Connexion impossible. Vérifiez votre réseau, puis réessayez.";
  }
  state.message = m; state.typeMessage = "err";
  state.occupe = false; dessiner();
  scrollHaut();
}
function scrollHaut(){
  try{ window.scrollTo({top:0, behavior:"smooth"}); }catch(e){ window.scrollTo(0,0); }
}

/* ---------- Actions ---------- */
function connexion(){
  var nom = (document.getElementById("f-nom").value||"").trim();
  var mdp = (document.getElementById("f-mdp").value||"").trim();
  if(!nom || !mdp){ state.message="Saisissez votre nom et votre mot de passe."; state.typeMessage="err"; dessiner(); return; }
  state.occupe = true; state.message = null; dessiner();
  appeler({action:"login", nom:nom, mdp:mdp}).then(function(j){
    state.nom = j.nom; state.mdp = mdp; state.admin = false;
    state.chantiers = j.chantiers; state.lundi = lundiDe(new Date());
    memoriser();
    return chargerMes();
  }).catch(erreur);
}
function connexionAdmin(){
  var mdp = (document.getElementById("f-admin").value||"").trim();
  if(!mdp){ state.message="Saisissez le mot de passe."; state.typeMessage="err"; dessiner(); return; }
  state.occupe = true; state.message = null; dessiner();
  appeler({action:"loginAdmin", mdp:mdp}).then(function(j){
    state.admin = true; state.nom = null; state.mdp = mdp;
    state.chantiers = j.chantiers;
    memoriser();
    return chargerTous();
  }).catch(erreur);
}
function chargerMes(){
  state.occupe = true; dessiner();
  return appeler({action:"mes", nom:state.nom, mdp:state.mdp}).then(function(j){
    state.pointages = j.pointages; state.occupe = false; dessiner();
  }).catch(erreur);
}
function chargerTous(){
  state.occupe = true; dessiner();
  return appeler({action:"tous", mdpAdmin:state.mdp}).then(function(j){
    state.pointages = j.pointages; state.ouvriers = j.ouvriers;
    state.occupe = false; dessiner();
  }).catch(erreur);
}
function deconnexion(){
  state.nom=null; state.mdp=null; state.admin=false;
  state.pointages=[]; state.message=null;
  memoriser(); dessiner();
}
function semPrec(){ state.lundi = jourPlus(state.lundi,-7); dessiner(); }
function semSuiv(){ state.lundi = jourPlus(state.lundi,7); dessiner(); }
function semAuj(){ state.lundi = lundiDe(new Date()); dessiner(); }

function ajouter(k){
  var sel = document.getElementById("ch-"+k), inp = document.getElementById("hr-"+k), ntEl = document.getElementById("nt-"+k);
  var code = sel.value;
  var h = parseFloat(String(inp.value).replace(",","."));
  var notes = ntEl ? (ntEl.value||"").trim().substring(0,200) : "";
  if(!code){ state.message="Choisissez un chantier."; state.typeMessage="err"; dessiner(); return; }
  if(!(h>0) || h>24){ state.message="Saisissez un nombre d'heures valide (ex : 8 ou 7.5)."; state.typeMessage="err"; dessiner(); return; }

  var nomCh = "";
  for(var n=0;n<state.chantiers.length;n++) if(state.chantiers[n].code===code) nomCh = state.chantiers[n].nom;

  var dejaPointe = 0;
  for(var i=0;i<state.pointages.length;i++){
    if(state.pointages[i].date===k && state.pointages[i].code===code) dejaPointe += state.pointages[i].heures;
  }
  if(dejaPointe > 0){
    var poursuivre = confirm("Vous avez déjà "+arrondi(dejaPointe)+" h enregistrées sur "+code+" - "+nomCh+" ce jour-là.\nAjouter "+h+" h de plus ?");
    if(!poursuivre) return;
  }

  state.occupe = true; state.message = null; dessiner();
  appeler({action:"ajouter", nom:state.nom, mdp:state.mdp, date:k, code:code, heures:h, notes:notes}).then(function(){
    state.message = "Enregistré : "+h+" h sur "+code+" - "+nomCh+" ("+affiche(k)+").";
    state.typeMessage = "ok";
    return chargerMes();
  }).then(function(){
    scrollHaut();
  }).catch(erreur);
}
function supprimer(id){
  if(!confirm("Supprimer cette ligne ?")) return;
  state.occupe = true; state.message = null; dessiner();
  var d = state.admin
    ? {action:"supprimer", id:id, mdpAdmin:state.mdp}
    : {action:"supprimer", id:id, nom:state.nom, mdp:state.mdp};
  appeler(d).then(state.admin ? chargerTous : chargerMes).catch(erreur);
}

/* ---------- Export Excel (aucune librairie externe) ---------- */
function exportExcel(){
  if(state.pointages.length === 0){ state.message="Aucun pointage à exporter."; state.typeMessage="err"; dessiner(); return; }
  var l = state.pointages.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
  var t = '<table border="1"><tr><th>Date</th><th>Ouvrier</th><th>Code affaire</th><th>Chantier</th><th>Heures</th><th>Notes</th></tr>';
  var tot = 0;
  for(var i=0;i<l.length;i++){
    tot += l[i].heures;
    t += '<tr><td>'+affiche(l[i].date)+'</td><td>'+esc(l[i].ouvrier)+'</td><td>'+esc(l[i].code)
      +  '</td><td>'+esc(l[i].chantier)+'</td><td>'+l[i].heures+'</td><td>'+esc(l[i].notes||"")+'</td></tr>';
  }
  t += '<tr><td colspan="4"><b>TOTAL</b></td><td><b>'+arrondi(tot)+'</b></td><td></td></tr></table>';
  var doc = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="UTF-8">'
    + '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
    + '<x:Name>Pointages</x:Name><x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>'
    + '</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]--></head><body>'+t+'</body></html>';
  var url = URL.createObjectURL(new Blob(["\ufeff"+doc],{type:"application/vnd.ms-excel;charset=utf-8"}));
  var a = document.createElement("a");
  a.href = url; a.download = "Pointages_"+cle(new Date())+".xls";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); },1000);
}

/* ---------- Rendu ---------- */
function bandeau(){
  if(!state.message) return "";
  return '<div class="msg msg-'+state.typeMessage+'">'+esc(state.message)+'</div>';
}
function dessiner(){
  var app = document.getElementById("app");
  if(state.admin) app.innerHTML = vueAdmin();
  else if(state.nom) app.innerHTML = vueOuvrier();
  else { app.innerHTML = vueLogin(); var n=document.getElementById("f-nom"); if(n && !state.occupe) n.focus(); }
}

function vueLogin(){
  var d = state.occupe ? " disabled" : "";
  var avert = API_URL.indexOf("script.google.com") === -1
    ? '<div class="msg msg-warn">L\'adresse du serveur n\'est pas encore renseignée dans le fichier (variable API_URL, tout en haut du script).</div>' : '';
  return ''
  + '<div class="login">'
  +   '<div class="logo"><div class="logo-text"><span class="logo-a">SP</span><span class="logo-b">2E</span></div>'
  +     '<div class="sub">Société Parisienne d\'Équipement Électrique</div></div>'
  +   avert + bandeau()
  +   '<h2>Connexion ouvrier</h2>'
  +   '<div class="fg"><label>Nom</label><input type="text" id="f-nom" autocomplete="username" placeholder="Ex : Nadeem"'+d+'></div>'
  +   '<div class="fg"><label>Mot de passe</label><input type="password" id="f-mdp" autocomplete="current-password" placeholder="****"'+d+'></div>'
  +   '<button type="button" class="btn btn-primary" style="width:100%" onclick="connexion()"'+d+'>'+(state.occupe?"Connexion…":"Se connecter")+'</button>'
  +   '<div class="divider"></div>'
  +   '<h2>Accès administrateur</h2>'
  +   '<div class="fg"><label>Mot de passe</label><input type="password" id="f-admin" placeholder="****"'+d+'></div>'
  +   '<button type="button" class="btn btn-admin" style="width:100%" onclick="connexionAdmin()"'+d+'>Entrer</button>'
  + '</div>';
}

function vueOuvrier(){
  var jours = semaine(state.lundi);
  var dis = state.occupe ? " disabled" : "";
  var h = ''
  + '<div class="header"><div class="header-in">'
  +   '<div><h1>Pointage chantier</h1><div class="sub">SP2E &middot; '+esc(state.nom)+'</div></div>'
  +   '<button type="button" class="btn btn-light" onclick="deconnexion()">Déconnexion</button>'
  + '</div></div><div class="container">'
  + bandeau()
  + (state.occupe ? '<div class="msg msg-info">Synchronisation en cours…</div>' : '')
  + '<div class="card">'
  +   '<div class="weeknav">'
  +     '<button type="button" class="btn btn-secondary" onclick="semPrec()">&larr; Semaine précédente</button>'
  +     '<div class="title">Semaine du '+affiche(cle(jours[0]))+' au '+affiche(cle(jours[5]))+'</div>'
  +     '<button type="button" class="btn btn-secondary" onclick="semSuiv()">Semaine suivante &rarr;</button>'
  +   '</div>'
  +   '<div style="text-align:center;margin-bottom:16px"><button type="button" class="btn btn-secondary" onclick="semAuj()">Revenir à cette semaine</button></div>';

  var totSem = 0;
  for(var i=0;i<jours.length;i++){
    var k = cle(jours[i]), duJour = [], totJour = 0;
    for(var j=0;j<state.pointages.length;j++){
      if(state.pointages[j].date === k){ duJour.push(state.pointages[j]); totJour += state.pointages[j].heures; }
    }
    totSem += totJour;
    h += '<div class="day"><div class="day-h">'
      +  '<div><div class="day-name">'+JOURS[i]+'</div><div class="day-date">'+affiche(k)+'</div></div>'
      +  '<div class="day-tot"><small>Total du jour</small>'+arrondi(totJour)+' h</div></div>';
    if(duJour.length === 0) h += '<div class="empty">Aucune heure saisie.</div>';
    for(var m=0;m<duJour.length;m++){
      h += '<div class="line"><div class="info"><div class="code">'+esc(duJour[m].code)+'</div>'
        +  '<div class="nom">'+esc(duJour[m].chantier)+'</div>'
        +  (duJour[m].notes ? '<div class="notes">'+esc(duJour[m].notes)+'</div>' : '')
        +  '</div>'
        +  '<div class="h">'+duJour[m].heures+' h</div>'
        +  '<button type="button" class="btn btn-danger" onclick="supprimer(\''+esc(duJour[m].id)+'\')"'+dis+'>Supprimer</button></div>';
    }
    h += '<div class="addrow"><select id="ch-'+k+'"'+dis+'><option value="">Choisir un chantier</option>';
    for(var n=0;n<state.chantiers.length;n++){
      h += '<option value="'+esc(state.chantiers[n].code)+'">'+esc(state.chantiers[n].code+" - "+state.chantiers[n].nom)+'</option>';
    }
    h += '</select><input type="number" id="hr-'+k+'" step="0.5" min="0" max="24" inputmode="decimal" placeholder="Heures"'+dis+'>'
      +  '<button type="button" class="btn btn-primary" onclick="ajouter(\''+k+'\')"'+dis+'>Ajouter</button></div>'
      +  '<textarea id="nt-'+k+'" class="notes-input" maxlength="200" rows="2" placeholder="Notes du jour (optionnel, 200 caractères max) : ce qui a été fait, matériel utilisé, remarques…"'+dis+'></textarea>'
      +  '</div>';
  }

  h += '<div class="wtot"><div class="l">Total de la semaine</div><div class="n">'+arrondi(totSem)+' h</div></div></div>';

  h += '<div class="card"><h2>Plans des chantiers</h2><div class="grid">';
  for(var q=0;q<state.chantiers.length;q++){
    var c = state.chantiers[q];
    h += '<div class="plan"><div class="code">'+esc(c.code)+'</div><div class="nom">'+esc(c.nom)+'</div><div class="l">';
    for(var r=0;r<c.plans.length;r++) h += esc(c.plans[r]) + (r<c.plans.length-1 ? '<br>' : '');
    h += '</div></div>';
  }
  h += '</div></div></div>';
  return h;
}

function vueAdmin(){
  var l = state.pointages.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
  var dis = state.occupe ? " disabled" : "";
  var h = ''
  + '<div class="header header-admin"><div class="header-in">'
  +   '<div><h1>Administration</h1><div class="sub">SP2E &middot; gestion des pointages</div></div>'
  +   '<button type="button" class="btn btn-light" onclick="deconnexion()">Déconnexion</button>'
  + '</div></div><div class="container">'
  + bandeau()
  + (state.occupe ? '<div class="msg msg-info">Synchronisation en cours…</div>' : '')
  + '<div class="card">'
  +   '<button type="button" class="btn btn-admin" onclick="exportExcel()"'+dis+'>Exporter vers Excel</button> '
  +   '<button type="button" class="btn btn-secondary" onclick="chargerTous()"'+dis+'>Actualiser</button>'
  + '</div>'
  + '<div class="card"><h2>Tous les pointages ('+l.length+')</h2>';

  if(l.length === 0){
    h += '<div class="empty">Aucun pointage enregistré.</div>';
  } else {
    h += '<div class="tw"><table><thead><tr><th>Date</th><th>Ouvrier</th><th>Code</th><th>Chantier</th><th>Heures</th><th>Notes</th><th></th></tr></thead><tbody>';
    for(var i=0;i<l.length;i++){
      h += '<tr><td>'+affiche(l[i].date)+'</td><td><b>'+esc(l[i].ouvrier)+'</b></td>'
        +  '<td style="color:#669900;font-weight:700">'+esc(l[i].code)+'</td><td>'+esc(l[i].chantier)+'</td>'
        +  '<td><b>'+l[i].heures+' h</b></td>'
        +  '<td style="max-width:260px;white-space:pre-wrap;word-break:break-word">'+esc(l[i].notes||"")+'</td>'
        +  '<td><button type="button" class="btn btn-danger" onclick="supprimer(\''+esc(l[i].id)+'\')"'+dis+'>Supprimer</button></td></tr>';
    }
    h += '</tbody></table></div>';
  }
  h += '</div><div class="card"><h2>Récapitulatif par ouvrier</h2><div class="grid">';
  for(var k=0;k<state.ouvriers.length;k++){
    var tot=0, nb=0;
    for(var j=0;j<state.pointages.length;j++){
      if(state.pointages[j].ouvrier === state.ouvriers[k]){ tot += state.pointages[j].heures; nb++; }
    }
    h += '<div class="sum"><div class="n">'+esc(state.ouvriers[k])+'</div>'
      +  '<div class="s">Lignes saisies : <b>'+nb+'</b></div>'
      +  '<div class="s">Total : <b>'+arrondi(tot)+' h</b></div></div>';
  }
  h += '</div></div></div>';
  return h;
}

/* ---------- Démarrage ---------- */
document.addEventListener("keydown", function(e){
  if(e.key !== "Enter" || state.occupe) return;
  var id = e.target && e.target.id;
  if(id === "f-admin") connexionAdmin();
  else if(id === "f-nom" || id === "f-mdp") connexion();
  else if(id && id.indexOf("hr-") === 0) ajouter(id.substring(3));
});

(function(){
  var s = reprendre();
  if(s && s.admin){
    state.admin = true; state.mdp = s.mdp;
    appeler({action:"loginAdmin", mdp:s.mdp}).then(function(j){
      state.chantiers = j.chantiers; return chargerTous();
    }).catch(function(){ deconnexion(); });
  } else if(s && s.nom){
    state.nom = s.nom; state.mdp = s.mdp;
    appeler({action:"login", nom:s.nom, mdp:s.mdp}).then(function(j){
      state.chantiers = j.chantiers; return chargerMes();
    }).catch(function(){ deconnexion(); });
  } else {
    dessiner();
  }
})();
</script>
</body>
</html>
